{% extends "crm/base.html" %}

{% block content %}
    <h1>Delete task</h1>

    <p>Are you sure you want to delete {{ task }}?</p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Delete</button>
    </form>

    <a href="{% url 'crm:task-detail' pk=task.pk %}">Cancel</a>
{% endblock %}
