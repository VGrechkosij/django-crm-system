{% extends "crm/base.html" %}

{% block content %}
    <h1>
        {% if client %} Update client {% else %} Create client {% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save</button>
    </form>

    <a href="{% url 'crm:client-list' %}">Cancel</a>
{% endblock %}
