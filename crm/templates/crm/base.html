<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}Django CRM System{% endblock %}</title>
</head>

<body>
    <header>
        <nav>
            <a href="{% url 'crm:index' %}">Home</a>
            <a href="{% url 'crm:client-list' %}">Clients</a>
            <a href="{% url 'crm:client-create' %}">Create client</a>
            <a href="{% url 'crm:task-list' %}">Tasks</a>
            <a href="{% url 'crm:task-create' %}">Create task</a>
            <a href="{% url 'crm:deal-list' %}">Deals</a>
            <a href="{% url 'crm:deal-create' %}">Create deal</a>

            {% if request.user.is_authenticated %}
                <span>{{ request.user.username }}</span>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        Footer
    </footer>
</body>
</html>
