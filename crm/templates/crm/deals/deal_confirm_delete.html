{% extends "crm/base.html" %}

{% block title %}Delete deal | Django CRM System{% endblock %}

{% block page_title %}Delete deal{% endblock %}

{% block content %}
    <section class="crm-card">
        <div class="mb-4">
            <h2 class="section-title mb-2">
                Are you sure?
            </h2>

            <p class="muted-text mb-0">
                You are going to delete deal:
                <strong>{{ deal }}</strong>
            </p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-outline-danger">
                    <i class="bi bi-trash"></i>
                    Delete
                </button>

                <a href="{% url 'crm:deal-detail' pk=deal.pk %}" class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </section>
{% endblock %}
