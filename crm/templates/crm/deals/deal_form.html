{% extends "crm/base.html" %}

{% block content %}
    <h1>
        {% if object %} Update deal {% else %} Create deal {% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Save</button>
    </form>

    <a href="{% url 'crm:deal-list' %}">Cancel</a>
{% endblock %}
